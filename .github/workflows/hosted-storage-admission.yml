name: Hosted storage admission fixture

on:
  push:
    branches:
      - feat/hosted-capacity-probe-20260923
    paths:
      - .github/workflows/hosted-storage-admission.yml
      - scripts/hosted-storage-admission.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Admit a preallocated 32 GiB disposable filesystem
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/hosted-capacity-probe-20260923
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_REPOSITORY=javAlborz/teleagent-release-authority \
            GITHUB_REF=refs/heads/feat/hosted-capacity-probe-20260923 \
            /usr/bin/python3 -I scripts/hosted-storage-admission.py
