name: Teleagent patched-source material projection diagnostic only

on:
  push:
    branches:
      - feat/hosted-capacity-probe-20260923
    paths:
      - .github/workflows/teleagent-patched-material-projection.yml
      - inputs/teleagent/source-pairs-patched-20260923.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    name: rehash-patched-app-public-materials-as-data-no-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: teleagent-private-source-read
    steps:
      - name: Require exact hosted authority branch and bounded storage
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/hosted-capacity-probe-20260923
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 31457280
      - name: Read exact authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: authority
      - name: Read exact private material projection source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/homelab-infrastructure
          ref: 1c15905f60f3a02195b13aec91944a01168ba20f
          ssh-key: ${{ secrets.TELEAGENT_INFRA_SOURCE_READ_KEY }}
          persist-credentials: false
          path: infrastructure
          sparse-checkout: |
            scripts/ci
            scripts/release/teleagent-offline-materials.py
      - name: Read exact patched public application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/teleagent
          ref: 4279253269c71acfda20916707d26b4e51591c16
          persist-credentials: false
          path: app
      - name: Bind exact source and all twelve package/lock bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C infrastructure rev-parse HEAD)" = 1c15905f60f3a02195b13aec91944a01168ba20f
          test "$(git -C app rev-parse HEAD)" = 4279253269c71acfda20916707d26b4e51591c16
          test "$(git -C app show -s --format=%T HEAD)" = 4cee03901bd9d63e76df086e54e1ba490b98cf68
          test -z "$(git -C authority status --porcelain)"
          test -z "$(git -C infrastructure status --porcelain)"
          test -z "$(git -C app status --porcelain)"
          printf '%s\n' \
            '9caec3e0fee3c9fa44782dddeaa56f3e306aa22e6a36f0b94c218a4b9c7aed4f  infrastructure/scripts/release/teleagent-offline-materials.py' \
            'dada99e66a0831b7ab974c392affcabe13b4c1ace13d2e9c9b65155d3c7900a9  authority/inputs/teleagent/source-pairs-patched-20260923.json' \
            | sha256sum --check --status
          python3 -I - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          rows = json.loads(Path('authority/inputs/teleagent/source-pairs-patched-20260923.json').read_bytes())
          assert isinstance(rows, list) and len(rows) == 12
          for row in rows:
              assert set(row) == {'path', 'sha256'}
              path = Path('app') / row['path']
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == row['sha256']
          PY
      - name: Acquire only bound public inputs as data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-inputs"
          python3 -I infrastructure/scripts/ci/acquire-teleagent-npm-materials.py \
            --app-root "$GITHUB_WORKSPACE/app" --output "$RUNNER_TEMP/teleagent-inputs/npm"
          python3 -I infrastructure/scripts/ci/acquire-teleagent-oci-materials.py \
            --output "$RUNNER_TEMP/teleagent-inputs/oci"
          python3 -I infrastructure/scripts/ci/acquire-teleagent-trivy-db.py \
            --output "$RUNNER_TEMP/teleagent-inputs/trivy" \
            --manifest-digest sha256:59c3d4df5f33836eb5dc3b817478f35b546f79ed250b47ebf10d3dc94f1de75e
          python3 -I authority/scripts/acquire-teleagent-fixed-inputs.py \
            --inputs "$GITHUB_WORKSPACE/authority/inputs/teleagent" \
            --output "$RUNNER_TEMP/teleagent-inputs/fixed"
          python3 -I authority/scripts/bind-teleagent-trivy-reference.py \
            --acquired "$RUNNER_TEMP/teleagent-inputs/trivy" \
            --reference "$GITHUB_WORKSPACE/authority/inputs/teleagent/trivy.json"
          printf '%s\n' \
            'cf92ba749d9405d7d29e547319b6af5ea26ecf9611cde0ca5e878e1eb23331f3  '"$RUNNER_TEMP"'/teleagent-inputs/npm/manifest.json' \
            'bcde585dc9f5ac35c932c60f28004cd269e124f5a1a09a73f3335b3a56091d8f  '"$RUNNER_TEMP"'/teleagent-inputs/oci/manifest.json' \
            '0d044673603e2e2c9c0ac23a8d0d9c7d694bae4f22542559e3f2fafe2012675c  '"$RUNNER_TEMP"'/teleagent-inputs/trivy/manifest.json' \
            | sha256sum --check --status
      - name: Project and hash patched material closure without executing vendor code
        shell: bash
        run: |
          set -euo pipefail
          python3 -I infrastructure/scripts/release/teleagent-offline-materials.py \
            --oci "$RUNNER_TEMP/teleagent-inputs/oci" \
            --npm "$RUNNER_TEMP/teleagent-inputs/npm" \
            --trivy "$RUNNER_TEMP/teleagent-inputs/trivy" \
            --tools "$RUNNER_TEMP/teleagent-inputs/fixed/tools" \
            --indexes "$RUNNER_TEMP/teleagent-inputs/fixed/indexes" \
            --apk "$RUNNER_TEMP/teleagent-inputs/fixed/apk" \
            --providers "$RUNNER_TEMP/teleagent-inputs/fixed/providers" \
            --app-source "$GITHUB_WORKSPACE/app" \
            --candidate-trivy-manifest-sha256 0d044673603e2e2c9c0ac23a8d0d9c7d694bae4f22542559e3f2fafe2012675c \
            --output "$RUNNER_TEMP/teleagent-patched-materials"
          sha256sum "$RUNNER_TEMP/teleagent-patched-materials/material-plan.json"
          python3 -I - "$RUNNER_TEMP/teleagent-patched-materials/material-plan.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          row = json.loads(Path(sys.argv[1]).read_bytes())
          assert row['schema'] == 'teleagent.offline-material-projection.v1'
          assert row['sourceLocks'][2]['sha256'] == '41e6f783d8869ffd924a8020e2e387ab19009f39cc290aedf95d45d8ecce327b'
          assert all(row[key] is False for key in ('buildExecuted','signatureVerified','trivyFreshnessAccepted'))
          print('Patched material projection is data-only; releaseApproved=false')
          PY
