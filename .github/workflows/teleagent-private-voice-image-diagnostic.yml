name: Teleagent current app private offline voice image diagnostic only

on:
  push:
    branches:
      - feat/hosted-capacity-probe-20260923
    paths:
      - .github/workflows/teleagent-private-voice-image-diagnostic.yml
      - scripts/hosted-private-voice-image-diagnostic.py
      - scripts/hosted-native-build-diagnostic.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: unsigned-private-voice-image-no-release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: teleagent-private-source-read
    steps:
      - name: Require exact hosted branch and storage admission
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/hosted-capacity-probe-20260923
          python3 - <<'PY'
          import os
          state = os.statvfs(os.environ['RUNNER_TEMP'])
          assert state.f_bavail * state.f_frsize >= 48 * 1024 ** 3
          assert state.f_favail >= 100000
          PY
      - name: Read exact authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: authority
      - name: Read exact private infrastructure source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/homelab-infrastructure
          ref: 4482c7f19ddf91cadcdf449bb8d1849c14abcf73
          ssh-key: ${{ secrets.TELEAGENT_INFRA_SOURCE_READ_KEY }}
          persist-credentials: false
          path: infrastructure
          sparse-checkout: |
            scripts/ci
            scripts/release
      - name: Read exact public application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/teleagent
          ref: 5c0bc437ec1731bad1e8c6c348d7c72cd2b7cbfb
          persist-credentials: false
          path: app
      - name: Bind checked-out source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C infrastructure rev-parse HEAD)" = 4482c7f19ddf91cadcdf449bb8d1849c14abcf73
          test "$(git -C app rev-parse HEAD)" = 5c0bc437ec1731bad1e8c6c348d7c72cd2b7cbfb
          test "$(git -C app show -s --format=%T HEAD)" = 3ab9261e2de3fdd3083c970a013f0b8d1ebfe12b
          test -z "$(git -C authority status --porcelain)"
          test -z "$(git -C infrastructure status --porcelain)"
          test -z "$(git -C app status --porcelain)"
          printf '%s\n' \
            '9caec3e0fee3c9fa44782dddeaa56f3e306aa22e6a36f0b94c218a4b9c7aed4f  infrastructure/scripts/release/teleagent-offline-materials.py' \
            '4242e5372337e33600f35386943e17197901f1e2c7fade9272f91fd74baf5707  infrastructure/scripts/release/teleagent-offline-engine-materials.py' \
            '9f7829de408b82cce0625df00d1ab87113a297f92b8669ff949a84a336d27490  infrastructure/scripts/release/teleagent-offline-voice-image-plan.py' \
            | sha256sum --check --status
      - name: Acquire public inputs as data only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-inputs"
          python3 -I infrastructure/scripts/ci/acquire-teleagent-npm-materials.py \
            --app-root "$GITHUB_WORKSPACE/app" --output "$RUNNER_TEMP/teleagent-inputs/npm"
          python3 -I infrastructure/scripts/ci/acquire-teleagent-oci-materials.py \
            --output "$RUNNER_TEMP/teleagent-inputs/oci"
          python3 -I infrastructure/scripts/ci/acquire-teleagent-trivy-db.py \
            --output "$RUNNER_TEMP/teleagent-inputs/trivy" \
            --manifest-digest sha256:59c3d4df5f33836eb5dc3b817478f35b546f79ed250b47ebf10d3dc94f1de75e
          python3 -I authority/scripts/acquire-teleagent-fixed-inputs.py \
            --inputs "$GITHUB_WORKSPACE/authority/inputs/teleagent" \
            --output "$RUNNER_TEMP/teleagent-inputs/fixed"
      - name: Bind fresh Trivy objects and exact acquisition manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I authority/scripts/bind-teleagent-trivy-reference.py \
            --acquired "$RUNNER_TEMP/teleagent-inputs/trivy" \
            --reference "$GITHUB_WORKSPACE/authority/inputs/teleagent/trivy.json"
          printf '%s\n' \
            'cf92ba749d9405d7d29e547319b6af5ea26ecf9611cde0ca5e878e1eb23331f3  '"$RUNNER_TEMP"'/teleagent-inputs/npm/manifest.json' \
            'bcde585dc9f5ac35c932c60f28004cd269e124f5a1a09a73f3335b3a56091d8f  '"$RUNNER_TEMP"'/teleagent-inputs/oci/manifest.json' \
            '0d044673603e2e2c9c0ac23a8d0d9c7d694bae4f22542559e3f2fafe2012675c  '"$RUNNER_TEMP"'/teleagent-inputs/trivy/manifest.json' \
            | sha256sum --check --status
      - name: Retrieve and verify exact unsigned musl dependency candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-musl-inputs"
          gh run download 35932701529 --repo javAlborz/teleagent-release-authority \
            --name unsigned-native-candidate-musl-1 \
            --dir "$RUNNER_TEMP/teleagent-musl-inputs"
          gh run download 35932701529 --repo javAlborz/teleagent-release-authority \
            --name unsigned-observation-musl-1 \
            --dir "$RUNNER_TEMP/teleagent-musl-inputs"
          python3 -I authority/scripts/extract-verified-musl-dependencies.py \
            --tar "$RUNNER_TEMP/teleagent-musl-inputs/musl-1.tar" \
            --observation "$RUNNER_TEMP/teleagent-musl-inputs/musl-1.json" \
            --destination "$RUNNER_TEMP/teleagent-musl-dependencies"
      - name: Execute one private bounded offline voice image diagnostic
        shell: bash
        run: |
          set -euo pipefail
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_REPOSITORY=javAlborz/teleagent-release-authority \
            GITHUB_REF=refs/heads/feat/hosted-capacity-probe-20260923 \
            /usr/bin/python3 -I authority/scripts/hosted-private-voice-image-diagnostic.py \
            --hosted "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          echo 'Private unsigned diagnostic completed; no signer, release or installation authority.'
      - name: Retain one-day unsigned private voice archive for independent comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-private-voice-image-current-app-diagnostic
          path: ${{ runner.temp }}/teleagent-private-voice-candidate/voice-image.docker.tar
          if-no-files-found: error
          retention-days: 1
