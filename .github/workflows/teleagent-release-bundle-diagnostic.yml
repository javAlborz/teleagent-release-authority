name: Teleagent current app unsigned release bundle closure diagnostic only

on:
  push:
    branches:
      - fix/teleagent-v3-gate-release
    paths:
      - .github/workflows/teleagent-release-bundle-diagnostic.yml
      - scripts/assemble-release-bundle-diagnostic.py
  workflow_dispatch:
    inputs:
      diagnose_one:
        description: Run one assembly while investigating a contract failure
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    name: assemble-unsigned-release-closure-${{ matrix.replica }}-no-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replica: ${{ fromJSON(inputs.diagnose_one == true && '["1"]' || '["1","2"]') }}
    steps:
      - name: Require exact hosted source and completed input evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/fix/teleagent-v3-gate-release
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 20971520
          for row in \
            '35935470213 197be7276c00fb9d1eb89b4739eec6dcec9e6b14 feat/hosted-capacity-probe-20260923' \
            '35936132628 135fff99bd109d43f58bbb4778df1c022afff746 feat/hosted-capacity-probe-20260923' \
            '36040835605 71ab465a43025af8266f9b00903c61cc3e0d9aba fix/teleagent-v3-gate-release' \
            '36041234613 68e876d6589e543162123f48fac00286e8a13403 fix/teleagent-v3-gate-release' \
            '36041611475 6333a7276eb3c57ac2b913b6b597befa81499ffa fix/teleagent-v3-gate-release' \
            '36041325195 1841ff26a897e920fcd705ecb695845159ae885c fix/teleagent-v3-gate-release' \
            '36041367429 1841ff26a897e920fcd705ecb695845159ae885c fix/teleagent-v3-gate-release'; do
            read -r run_id head expected_branch <<< "$row"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '[.status,.conclusion,.head_sha,.head_branch] | @tsv' \
              | { read -r status conclusion observed branch
                  test "$status" = completed
                  test "$conclusion" = success
                  test "$observed" = "$head"
                  test "$branch" = "$expected_branch"
                }
          done
      - name: Read exact authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: authority
      - name: Read exact patched application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/teleagent
          ref: fd254f37a3017ad3475449987197706bbdbe7be7
          persist-credentials: false
          path: app
      - name: Bind checked-out source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C app rev-parse HEAD)" = fd254f37a3017ad3475449987197706bbdbe7be7
          test "$(git -C app show -s --format=%T HEAD)" = 7f605327107588728ae1a96cabe3977ecf707156
          test -z "$(git -C authority status --porcelain)"
          test -z "$(git -C app status --porcelain)"
      - name: Acquire fixed public provider and tool inputs as data
        shell: bash
        run: |
          set -euo pipefail
          python3 -I authority/scripts/acquire-teleagent-fixed-inputs.py \
            --inputs "$GITHUB_WORKSPACE/authority/inputs/teleagent" \
            --output "$RUNNER_TEMP/teleagent-release-fixed"
      - name: Retrieve exact unsigned build, image and SBOM data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-release-inputs"
          gh run download 35935470213 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-native-candidate-glibc-retry \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          gh run download 35935470213 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-observation-glibc-retry \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          gh run download 36040835605 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-voice-image-current-app-diagnostic \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          gh run download 36041367429 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-voice-sbom-1 \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          test "$(find "$RUNNER_TEMP/teleagent-release-inputs" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 4
      - name: Assemble and verify one deterministic unsigned release closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-release-work"
          python3 -I authority/scripts/assemble-release-bundle-diagnostic.py \
            --app "$GITHUB_WORKSPACE/app" \
            --fixed "$RUNNER_TEMP/teleagent-release-fixed" \
            --glibc-tar "$RUNNER_TEMP/teleagent-release-inputs/glibc-retry.tar" \
            --glibc-observation "$RUNNER_TEMP/teleagent-release-inputs/glibc-retry.json" \
            --voice-image "$RUNNER_TEMP/teleagent-release-inputs/teleagent-voice-image-diagnostic.docker.tar" \
            --voice-sbom "$RUNNER_TEMP/teleagent-release-inputs/voice.cdx.json" \
            --work "$RUNNER_TEMP/teleagent-release-work" \
            | tee "$RUNNER_TEMP/release-bundle-summary.json"
          test -s "$RUNNER_TEMP/teleagent-release-work/teleagent-release.diagnostic.tar"
          cp "$RUNNER_TEMP/release-bundle-summary.json" \
            "$RUNNER_TEMP/teleagent-release-work/summary.json"
          echo 'Unsigned release closure diagnostic completed; no promotion, signing or installation was authorized.'
      - name: Retain only one-day unsigned bundle and bounded summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-bundle-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/teleagent-release-work/teleagent-release.diagnostic.tar
            ${{ runner.temp }}/teleagent-release-work/summary.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  compare:
    name: compare-two-unsigned-release-closures-no-release
    if: inputs.diagnose_one != true
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read both one-day unsigned release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unsigned-release-bundle-*
          path: ${{ runner.temp }}/teleagent-release-bundles
      - name: Compare complete bundles and bound diagnostic summaries
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/teleagent-release-bundles/unsigned-release-bundle-1"
          second="$RUNNER_TEMP/teleagent-release-bundles/unsigned-release-bundle-2"
          test -s "$first/teleagent-release.diagnostic.tar"
          test -s "$second/teleagent-release.diagnostic.tar"
          cmp --silent "$first/teleagent-release.diagnostic.tar" \
            "$second/teleagent-release.diagnostic.tar"
          cmp --silent "$first/summary.json" "$second/summary.json"
          sha256sum "$first/teleagent-release.diagnostic.tar" \
            "$second/teleagent-release.diagnostic.tar"
          cat "$first/summary.json"
          echo 'Two unsigned closure diagnostics match; releaseApproved=false.'
