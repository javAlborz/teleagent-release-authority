name: Teleagent v25 unsigned hosted voice image replicas

on:
  push:
    branches:
      - feat/teleagent-v25-release-authority-20260926
    paths:
      - .github/workflows/teleagent-v25-hosted-voice-image.yml
      - scripts/v25-voice-image-plan.py
      - scripts/project-v17-sqlite-napi.py
      - scripts/test_project_v17_sqlite_napi.py
      - inputs/teleagent/sqlite-napi-v17.json
      - inputs/teleagent/source-pairs-v17-20260926.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: unsigned-v25-voice-image-${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        replica: ['1', '2']
    steps:
      - name: Require exact hosted authority source and native input job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/teleagent-v25-release-authority-20260926
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 15728640
          gh api repos/javAlborz/teleagent-release-authority/actions/jobs/107422715450 \
            --jq '[.status,.conclusion,.run_id,.name] | @tsv' \
            | { read -r status conclusion run_id name
                test "$status" = completed
                test "$conclusion" = success
                test "$run_id" = 35932701529
                test "$name" = unsigned-musl-1
              }
      - name: Read exact authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: authority
      - name: Read exact public app source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/teleagent
          ref: 38542697a44b5314b6cfe73d17f7f7548ff57bf6
          persist-credentials: false
          path: app
      - name: Bind source identities and render fixed offline recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I authority/scripts/test_project_v17_sqlite_napi.py
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C app rev-parse HEAD)" = 38542697a44b5314b6cfe73d17f7f7548ff57bf6
          test "$(git -C app show -s --format=%T HEAD)" = 9165e2dc3b3d158bb95c11cf82a68a71e85a8ead
          test "$(git -C app show -s --format=%ct HEAD)" = 1790442009
          test -z "$(git -C authority status --porcelain)"
          test -z "$(git -C app status --porcelain)"
          python3 -I - <<'PY'
          import hashlib, json
          from pathlib import Path
          record = Path('authority/inputs/teleagent/source-pairs-v17-20260926.json')
          assert hashlib.sha256(record.read_bytes()).hexdigest() == '0518fb03ede3624a45798c66860ea8d29e62d52def9cddca087949a2ceff5e82'
          pairs = json.loads(record.read_bytes())
          assert len(pairs) == 12
          for row in pairs:
              assert hashlib.sha256((Path('app') / row['path']).read_bytes()).hexdigest() == row['sha256']
          PY
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-v25-voice-recipe"
          python3 -I - "$RUNNER_TEMP/teleagent-v25-voice-recipe/Dockerfile" <<'PY'
          from pathlib import Path
          import runpy
          import sys
          source = runpy.run_path('authority/scripts/v25-voice-image-plan.py', run_name='v25_voice_recipe')
          assert source['APP_REVISION'] == '38542697a44b5314b6cfe73d17f7f7548ff57bf6'
          assert source['APP_TREE'] == '9165e2dc3b3d158bb95c11cf82a68a71e85a8ead'
          assert source['APP_EPOCH'] == 1790442009
          assert source['MUSL_DEPENDENCY_TAR'] == '7f5f674aa3c1fb890747e9f8b3dc3c68e9e80633b969dc8f1636303655cfc925'
          Path(sys.argv[1]).write_text(source['dockerfile'](), encoding='ascii')
          PY
      - name: Retrieve exact preserved hosted musl candidate as unsigned data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-v25-musl-inputs"
          gh release download teleagent-native-materials-20260923 \
            --repo javAlborz/teleagent-release-authority \
            --pattern musl-1.tar --pattern musl-1.json \
            --dir "$RUNNER_TEMP/teleagent-v25-musl-inputs"
          printf '%s\n' \
            '7f5f674aa3c1fb890747e9f8b3dc3c68e9e80633b969dc8f1636303655cfc925  '"$RUNNER_TEMP"'/teleagent-v25-musl-inputs/musl-1.tar' \
            '36ed8e682d6ec6275a5ffaf7bf92045496353bd2e94d4d535989dc6d2e4c2929  '"$RUNNER_TEMP"'/teleagent-v25-musl-inputs/musl-1.json' \
            | sha256sum --check --status
          python3 -I authority/scripts/extract-verified-musl-dependencies.py \
            --tar "$RUNNER_TEMP/teleagent-v25-musl-inputs/musl-1.tar" \
            --observation "$RUNNER_TEMP/teleagent-v25-musl-inputs/musl-1.json" \
            --destination "$RUNNER_TEMP/teleagent-v25-musl-dependencies"
      - name: Project verified N-API SQLite packages into the unsigned musl tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -I authority/scripts/project-v17-sqlite-napi.py \
            --acquire "$RUNNER_TEMP/teleagent-v25-napi-inputs"
          python3 -I authority/scripts/project-v17-sqlite-napi.py \
            --root "$RUNNER_TEMP/teleagent-v25-musl-dependencies" \
            --app "$GITHUB_WORKSPACE/app" \
            --inputs "$RUNNER_TEMP/teleagent-v25-napi-inputs" --target musl
      - name: Stage fixed signed-index local Alpine packages
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/teleagent-v25-apk-materials/apk"
          mkdir -p "$apk/main/x86_64" "$apk/community/x86_64"
          install -m 0444 authority/inputs/teleagent/index-objects/c1cbca81ade3696886de11a5f02777fe185ccba525edd58403e29b08050993a1 \
            "$apk/main/x86_64/APKINDEX.tar.gz"
          install -m 0444 authority/inputs/teleagent/index-objects/0134bc50ab7ac75bf593d035e6278a365e8d83a6157f685b3ffe5e78985f9dd3 \
            "$apk/community/x86_64/APKINDEX.tar.gz"
          printf '/materials/apk/main\n/materials/apk/community\n' > "$apk/repositories"
          printf '%s\n' \
            'c1cbca81ade3696886de11a5f02777fe185ccba525edd58403e29b08050993a1  '"$apk"'/main/x86_64/APKINDEX.tar.gz' \
            '0134bc50ab7ac75bf593d035e6278a365e8d83a6157f685b3ffe5e78985f9dd3  '"$apk"'/community/x86_64/APKINDEX.tar.gz' \
            | sha256sum --check --status
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --output "$apk/main/x86_64/libcrypto3-3.5.8-r0.apk" \
            https://dl-cdn.alpinelinux.org/alpine/v3.24/main/x86_64/libcrypto3-3.5.8-r0.apk
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --output "$apk/main/x86_64/libssl3-3.5.8-r0.apk" \
            https://dl-cdn.alpinelinux.org/alpine/v3.24/main/x86_64/libssl3-3.5.8-r0.apk
          test "$(stat -c %s "$apk/main/x86_64/libcrypto3-3.5.8-r0.apk")" = 1978546
          test "$(stat -c %s "$apk/main/x86_64/libssl3-3.5.8-r0.apk")" = 379265
          printf '%s\n' \
            '161223a16f042b8e469e9441291e071464fd91d4f4bbe6f496ee8d0abd4e0701  '"$apk"'/main/x86_64/libcrypto3-3.5.8-r0.apk' \
            'aca521e5ae4a321322a9d47ed64a1775f5ab1ffd215d1e9fc0433c58f7bfd037  '"$apk"'/main/x86_64/libssl3-3.5.8-r0.apk' \
            | sha256sum --check --status
      - name: Build one unsigned network-disconnected voice image
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1790442009
          builder="teleagent-v25-voice-${{ matrix.replica }}"
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:a461e7f0ce921972028acfbed628d45663d83e67ac1230722c2b34cf72760a0d \
            --bootstrap
          docker buildx build --builder "$builder" \
            --platform linux/amd64 --no-cache --network none --provenance=false \
            --build-arg SOURCE_DATE_EPOCH=1790442009 \
            --build-context voice-base=docker-image://node:24-alpine@sha256:2a49bdf71e9fd965a58c1703fd9ddd205b34e5782b692a72dd1d248abb0beb43 \
            --build-context app="$GITHUB_WORKSPACE/app" \
            --build-context dependencies="$RUNNER_TEMP/teleagent-v25-musl-dependencies" \
            --build-context materials="$RUNNER_TEMP/teleagent-v25-apk-materials" \
            --file "$RUNNER_TEMP/teleagent-v25-voice-recipe/Dockerfile" \
            --tag teleagent-v25-voice-diagnostic:20260926 \
            --output "type=docker,dest=$RUNNER_TEMP/teleagent-v25-voice-image.docker.tar,rewrite-timestamp=true" \
            "$RUNNER_TEMP/teleagent-v25-voice-recipe"
          docker load --input "$RUNNER_TEMP/teleagent-v25-voice-image.docker.tar"
          test "$(docker image inspect teleagent-v25-voice-diagnostic:20260926 \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            38542697a44b5314b6cfe73d17f7f7548ff57bf6
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --user 10001:10001 --entrypoint node teleagent-v25-voice-diagnostic:20260926 \
            -e 'const DB=require("better-sqlite3");const db=new DB(":memory:");let a=[];for(let i=0;i<100000;i++){db.prepare("SELECT 1").get();a.push({i});if(a.length>1000)a=[];}db.close();console.log("VOICE_NATIVE_SMOKE_OK")'
          sha256sum "$RUNNER_TEMP/teleagent-v25-voice-image.docker.tar"
      - name: Retain unsigned hosted voice image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-v25-voice-image-${{ matrix.replica }}
          path: ${{ runner.temp }}/teleagent-v25-voice-image.docker.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  compare:
    name: compare-independent-hosted-voice-images
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read both unsigned image replicas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          pattern: unsigned-v25-voice-image-*
          path: ${{ runner.temp }}/teleagent-v25-voice-images
      - name: Compare every byte of independently built images
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/teleagent-v25-voice-images/unsigned-v25-voice-image-1/teleagent-v25-voice-image.docker.tar"
          second="$RUNNER_TEMP/teleagent-v25-voice-images/unsigned-v25-voice-image-2/teleagent-v25-voice-image.docker.tar"
          test -s "$first"
          test -s "$second"
          cmp --silent "$first" "$second"
          sha256sum "$first" "$second"
          echo 'Two unsigned hosted voice image replicas match; releaseApproved=false.'
