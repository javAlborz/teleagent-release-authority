name: Teleagent v82 hosted unsigned release bundle replicas

on:
  push:
    branches:
      - fix/teleagent-v82-clarification-authority-20261023
    paths:
      - .github/workflows/teleagent-v82-hosted-release-bundle.yml
      - scripts/assemble-v82-release-bundle.py
      - scripts/project-v50-controller-ws.py
      - scripts/test_project_v50_controller_ws.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    name: assemble-unsigned-release-closure-${{ matrix.replica }}-no-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        replica: ['1', '2']
    steps:
      - name: Require exact hosted source and completed input evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/fix/teleagent-v82-clarification-authority-20261023
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 20971520
          for row in \
            '35935470213 197be7276c00fb9d1eb89b4739eec6dcec9e6b14 feat/hosted-capacity-probe-20260923' \
            '39930459862 8424b5e666f9b0f921dd53e6d566008fbe897294 fix/teleagent-v82-clarification-authority-20261023' \
            '39932431370 37bf4b6caf956af3e8f0896bab1968532785b483 fix/teleagent-v82-clarification-authority-20261023' \
            '39932183797 9069b97839c509c9fa27a4c6246696a8a379740d fix/teleagent-v82-clarification-authority-20261023'; do
            read -r run_id head expected_branch <<< "$row"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '[.status,.conclusion,.head_sha,.head_branch] | @tsv' \
              | { read -r status conclusion observed branch
                  test "$status" = completed
                  test "$conclusion" = success
                  test "$observed" = "$head"
                  test "$branch" = "$expected_branch"
                }
          done
      - name: Read exact authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: authority
      - name: Read exact patched application source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/teleagent
          ref: 3d8a0c01a513464caa0ccd7b0988a5018b2ae23e
          persist-credentials: false
          path: app
      - name: Bind checked-out source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C app rev-parse HEAD)" = 3d8a0c01a513464caa0ccd7b0988a5018b2ae23e
          test "$(git -C app show -s --format=%T HEAD)" = 4749ce8fa4081d93e6eb33b05fa17bb6d67470a0
          test -z "$(git -C authority status --porcelain)"
          test -z "$(git -C app status --porcelain)"
      - name: Acquire fixed public provider and tool inputs as data
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B authority/scripts/test_acquire_teleagent_fixed_inputs.py
          python3 -I authority/scripts/acquire-teleagent-fixed-inputs.py \
            --inputs "$GITHUB_WORKSPACE/authority/inputs/teleagent" --purpose release \
            --output "$RUNNER_TEMP/teleagent-release-fixed"
      - name: Retrieve exact unsigned build, image and SBOM data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-release-inputs"
          gh release download teleagent-native-materials-20260923 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'glibc-2.tar' --pattern 'glibc-2.json' \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          gh run download 39930459862 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-v82-voice-image-2 \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          gh run download 39932431370 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-v82-voice-sbom-1 \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          gh run download 39932183797 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-v82-voice-image-scan \
            --dir "$RUNNER_TEMP/teleagent-release-inputs"
          test "$(find "$RUNNER_TEMP/teleagent-release-inputs" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 7
          python3 -I authority/scripts/verify-v82-voice-scan.py \
            --image "$RUNNER_TEMP/teleagent-release-inputs/teleagent-v82-voice-image.docker.tar" \
            --report "$RUNNER_TEMP/teleagent-release-inputs/scan.json" \
            --metadata "$RUNNER_TEMP/teleagent-release-inputs/db-metadata.json" \
            > "$RUNNER_TEMP/teleagent-release-inputs/scan-recheck.json"
          cmp --silent "$RUNNER_TEMP/teleagent-release-inputs/scan-check.json" \
            "$RUNNER_TEMP/teleagent-release-inputs/scan-recheck.json"
      - name: Acquire exact N-API SQLite package inputs
        shell: bash
        run: |
          python3 -I authority/scripts/project-v17-sqlite-napi.py \
            --acquire "$RUNNER_TEMP/teleagent-v82-napi-inputs"
      - name: Acquire and verify the fixed pure-JavaScript controller dependency
        shell: bash
        run: |
          python3 -I authority/scripts/test_project_v50_controller_ws.py
          python3 -I authority/scripts/project-v50-controller-ws.py \
            --archive "$RUNNER_TEMP/teleagent-v82-ws.tgz" --acquire
      - name: Acquire and verify patched proxy-addr package bytes
        shell: bash
        run: |
          python3 -I authority/scripts/test_project_v66_proxy_addr.py
          python3 -I authority/scripts/project-v66-proxy-addr.py \
            --acquire --archive "$RUNNER_TEMP/teleagent-v82-proxy-addr.tgz"
      - name: Assemble and verify one deterministic unsigned release closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-release-work"
          python3 -I authority/scripts/assemble-v82-release-bundle.py \
            --app "$GITHUB_WORKSPACE/app" \
            --fixed "$RUNNER_TEMP/teleagent-release-fixed" \
            --glibc-tar "$RUNNER_TEMP/teleagent-release-inputs/glibc-2.tar" \
            --glibc-observation "$RUNNER_TEMP/teleagent-release-inputs/glibc-2.json" \
            --voice-image "$RUNNER_TEMP/teleagent-release-inputs/teleagent-v82-voice-image.docker.tar" \
            --voice-sbom "$RUNNER_TEMP/teleagent-release-inputs/voice.cdx.json" \
            --napi-inputs "$RUNNER_TEMP/teleagent-v82-napi-inputs" \
            --ws-archive "$RUNNER_TEMP/teleagent-v82-ws.tgz" \
            --proxy-addr-archive "$RUNNER_TEMP/teleagent-v82-proxy-addr.tgz" \
            --work "$RUNNER_TEMP/teleagent-release-work" \
            | tee "$RUNNER_TEMP/release-bundle-summary.json"
          test -s "$RUNNER_TEMP/teleagent-release-work/teleagent-release.diagnostic.tar"
          cp "$RUNNER_TEMP/release-bundle-summary.json" \
            "$RUNNER_TEMP/teleagent-release-work/summary.json"
          echo 'Unsigned release closure diagnostic completed; no promotion, signing or installation was authorized.'
      - name: Retain only unsigned bundle and bounded summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-v82-release-bundle-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/teleagent-release-work/teleagent-release.diagnostic.tar
            ${{ runner.temp }}/teleagent-release-work/summary.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  compare:
    name: compare-two-unsigned-release-closures-no-release
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read both unsigned release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          pattern: unsigned-v82-release-bundle-*
          path: ${{ runner.temp }}/teleagent-release-bundles
      - name: Compare complete bundles and bound diagnostic summaries
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/teleagent-release-bundles/unsigned-v82-release-bundle-1"
          second="$RUNNER_TEMP/teleagent-release-bundles/unsigned-v82-release-bundle-2"
          test -s "$first/teleagent-release.diagnostic.tar"
          test -s "$second/teleagent-release.diagnostic.tar"
          cmp --silent "$first/teleagent-release.diagnostic.tar" \
            "$second/teleagent-release.diagnostic.tar"
          cmp --silent "$first/summary.json" "$second/summary.json"
          sha256sum "$first/teleagent-release.diagnostic.tar" \
            "$second/teleagent-release.diagnostic.tar"
          cat "$first/summary.json"
          echo 'Two unsigned closure diagnostics match; releaseApproved=false.'
