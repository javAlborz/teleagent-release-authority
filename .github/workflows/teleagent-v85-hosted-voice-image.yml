name: Teleagent v85 unsigned hosted voice image replicas

on:
  push:
    branches:
      - fix/teleagent-v85-followups-authority-20261027
    paths:
      - .github/workflows/teleagent-v85-hosted-voice-image.yml
      - scripts/v85-voice-image-plan.py
      - scripts/project-v85-body-parser.py
      - scripts/test_project_v85_body_parser.py
      - inputs/teleagent/body-parser-v85.json
      - scripts/stage-v84-runtime-apks.py
      - inputs/teleagent/runtime-apk-v84.json
      - scripts/project-v81-follow-redirects.py
      - scripts/test_project_v81_follow_redirects.py
      - inputs/teleagent/follow-redirects-v81.json
      - scripts/project-v66-proxy-addr.py
      - scripts/test_project_v66_proxy_addr.py
      - inputs/teleagent/proxy-addr-v66.json
      - scripts/project-v17-sqlite-napi.py
      - scripts/test_project_v17_sqlite_napi.py
      - scripts/project-v53-voice-axios.py
      - scripts/test_project_v53_voice_axios.py
      - inputs/teleagent/voice-axios-v53.json
      - inputs/teleagent/sqlite-napi-v17.json
      - inputs/teleagent/source-pairs-v85-20261027.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  image:
    name: unsigned-v85-voice-image-${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        replica: ['1', '2']
    steps:
      - name: Require exact hosted authority source and native input job
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/fix/teleagent-v85-followups-authority-20261027
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 15728640
          gh api repos/javAlborz/teleagent-release-authority/actions/jobs/107422715450 \
            --jq '[.status,.conclusion,.run_id,.name] | @tsv' \
            | { read -r status conclusion run_id name
                test "$status" = completed
                test "$conclusion" = success
                test "$run_id" = 35932701529
                test "$name" = unsigned-musl-1
              }
      - name: Read exact authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          path: authority
      - name: Read exact public app source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: javAlborz/teleagent
          ref: 6274bb9d23fa22de89011dc5059bd96e90359eea
          persist-credentials: false
          path: app
      - name: Bind source identities and render fixed offline recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -I authority/scripts/test_project_v17_sqlite_napi.py
          python3 -B -I authority/scripts/test_project_v53_voice_axios.py
          test "$(git -C authority rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C app rev-parse HEAD)" = 6274bb9d23fa22de89011dc5059bd96e90359eea
          test "$(git -C app show -s --format=%T HEAD)" = f847fe876308d7af3d9de47e5f5c4b2eac5782bb
          test "$(git -C app show -s --format=%ct HEAD)" = 1793110330
          test -z "$(git -C authority status --porcelain)"
          test -z "$(git -C app status --porcelain)"
          python3 -I - <<'PY'
          import hashlib, json
          from pathlib import Path
          record = Path('authority/inputs/teleagent/source-pairs-v85-20261027.json')
          assert hashlib.sha256(record.read_bytes()).hexdigest() == '48ffad8d8e4cd0f5df5c10557fbec4f7a25d89ac5bf2ce722e202db73065a889'
          pairs = json.loads(record.read_bytes())
          assert len(pairs) == 12
          for row in pairs:
              assert hashlib.sha256((Path('app') / row['path']).read_bytes()).hexdigest() == row['sha256']
          PY
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-v85-voice-recipe"
          python3 -I - "$RUNNER_TEMP/teleagent-v85-voice-recipe/Dockerfile" <<'PY'
          from pathlib import Path
          import runpy
          import sys
          source = runpy.run_path('authority/scripts/v85-voice-image-plan.py', run_name='v85_voice_recipe')
          assert source['APP_REVISION'] == '6274bb9d23fa22de89011dc5059bd96e90359eea'
          assert source['APP_TREE'] == 'f847fe876308d7af3d9de47e5f5c4b2eac5782bb'
          assert source['APP_EPOCH'] == 1793110330
          assert source['MUSL_DEPENDENCY_TAR'] == '7f5f674aa3c1fb890747e9f8b3dc3c68e9e80633b969dc8f1636303655cfc925'
          Path(sys.argv[1]).write_text(source['dockerfile'](), encoding='ascii')
          PY
      - name: Retrieve exact preserved hosted musl candidate as unsigned data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-v85-musl-inputs"
          gh release download teleagent-native-materials-20260923 \
            --repo javAlborz/teleagent-release-authority \
            --pattern musl-1.tar --pattern musl-1.json \
            --dir "$RUNNER_TEMP/teleagent-v85-musl-inputs"
          printf '%s\n' \
            '7f5f674aa3c1fb890747e9f8b3dc3c68e9e80633b969dc8f1636303655cfc925  '"$RUNNER_TEMP"'/teleagent-v85-musl-inputs/musl-1.tar' \
            '36ed8e682d6ec6275a5ffaf7bf92045496353bd2e94d4d535989dc6d2e4c2929  '"$RUNNER_TEMP"'/teleagent-v85-musl-inputs/musl-1.json' \
            | sha256sum --check --status
          python3 -I authority/scripts/extract-verified-musl-dependencies.py \
            --tar "$RUNNER_TEMP/teleagent-v85-musl-inputs/musl-1.tar" \
            --observation "$RUNNER_TEMP/teleagent-v85-musl-inputs/musl-1.json" \
            --destination "$RUNNER_TEMP/teleagent-v85-musl-dependencies"
      - name: Project verified Axios and N-API SQLite packages into the unsigned musl tree
        shell: bash
        run: |
          set -euo pipefail
          python3 -I authority/scripts/project-v53-voice-axios.py \
            --acquire --archive "$RUNNER_TEMP/teleagent-v85-axios.tgz"
          python3 -I authority/scripts/project-v53-voice-axios.py \
            --archive "$RUNNER_TEMP/teleagent-v85-axios.tgz" \
            --root "$RUNNER_TEMP/teleagent-v85-musl-dependencies" --app "$GITHUB_WORKSPACE/app"
          python3 -I authority/scripts/test_project_v66_proxy_addr.py
          python3 -I authority/scripts/project-v66-proxy-addr.py \
            --acquire --archive "$RUNNER_TEMP/teleagent-v85-proxy-addr.tgz"
          python3 -I authority/scripts/project-v66-proxy-addr.py \
            --archive "$RUNNER_TEMP/teleagent-v85-proxy-addr.tgz" \
            --root "$RUNNER_TEMP/teleagent-v85-musl-dependencies" --app "$GITHUB_WORKSPACE/app" --component voice-app
          python3 -I -B authority/scripts/test_project_v81_follow_redirects.py
          python3 -I -B authority/scripts/project-v81-follow-redirects.py \
            --acquire --archive "$RUNNER_TEMP/teleagent-v85-follow-redirects.tgz"
          python3 -I -B authority/scripts/project-v81-follow-redirects.py \
            --archive "$RUNNER_TEMP/teleagent-v85-follow-redirects.tgz" \
            --root "$RUNNER_TEMP/teleagent-v85-musl-dependencies" --app "$GITHUB_WORKSPACE/app" --component voice-app
          python3 -I -B authority/scripts/test_project_v85_body_parser.py
          python3 -I -B authority/scripts/project-v85-body-parser.py \
            --acquire --archive "$RUNNER_TEMP/teleagent-v85-body-parser.tgz"
          python3 -I -B authority/scripts/project-v85-body-parser.py \
            --archive "$RUNNER_TEMP/teleagent-v85-body-parser.tgz" \
            --root "$RUNNER_TEMP/teleagent-v85-musl-dependencies" --app "$GITHUB_WORKSPACE/app" --component voice-app
          python3 -I authority/scripts/project-v17-sqlite-napi.py \
            --acquire "$RUNNER_TEMP/teleagent-v85-napi-inputs"
          python3 -I authority/scripts/project-v17-sqlite-napi.py \
            --root "$RUNNER_TEMP/teleagent-v85-musl-dependencies" \
            --app "$GITHUB_WORKSPACE/app" \
            --inputs "$RUNNER_TEMP/teleagent-v85-napi-inputs" --target musl
      - name: Stage fixed signed-index Alpine runtime security updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/teleagent-v85-apk-inputs"
          mkdir -m 0700 "$source"
          gh release download teleagent-pinned-apk-materials-20261023 \
            --repo javAlborz/teleagent-release-authority \
            --pattern APKINDEX.tar.gz --pattern '*.apk' --dir "$source"
          python3 -I -B authority/scripts/stage-v84-runtime-apks.py \
            --source "$source" --destination "$RUNNER_TEMP/teleagent-v85-apk-materials"
      - name: Build one unsigned network-disconnected voice image
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH=1793110330
          builder="teleagent-v85-voice-${{ matrix.replica }}"
          trap 'docker buildx rm "$builder" >/dev/null 2>&1 || true' EXIT
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt image=moby/buildkit@sha256:a461e7f0ce921972028acfbed628d45663d83e67ac1230722c2b34cf72760a0d \
            --bootstrap
          docker buildx build --builder "$builder" \
            --platform linux/amd64 --no-cache --network none --provenance=false \
            --build-arg SOURCE_DATE_EPOCH=1793110330 \
            --build-context voice-base=docker-image://node:24-alpine@sha256:2a49bdf71e9fd965a58c1703fd9ddd205b34e5782b692a72dd1d248abb0beb43 \
            --build-context app="$GITHUB_WORKSPACE/app" \
            --build-context dependencies="$RUNNER_TEMP/teleagent-v85-musl-dependencies" \
            --build-context materials="$RUNNER_TEMP/teleagent-v85-apk-materials" \
            --file "$RUNNER_TEMP/teleagent-v85-voice-recipe/Dockerfile" \
            --tag teleagent-v85-voice-diagnostic:20260926 \
            --output "type=docker,dest=$RUNNER_TEMP/teleagent-v85-voice-image.docker.tar,rewrite-timestamp=true" \
            "$RUNNER_TEMP/teleagent-v85-voice-recipe"
          docker load --input "$RUNNER_TEMP/teleagent-v85-voice-image.docker.tar"
          test "$(docker image inspect teleagent-v85-voice-diagnostic:20260926 \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            6274bb9d23fa22de89011dc5059bd96e90359eea
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --user 10001:10001 --entrypoint node teleagent-v85-voice-diagnostic:20260926 \
            -e 'if(require("body-parser/package.json").version!=="1.20.9")throw Error("body-parser differs");const DB=require("better-sqlite3");const db=new DB(":memory:");let a=[];for(let i=0;i<100000;i++){db.prepare("SELECT 1").get();a.push({i});if(a.length>1000)a=[];}db.close();console.log("VOICE_NATIVE_SMOKE_OK")'
          sha256sum "$RUNNER_TEMP/teleagent-v85-voice-image.docker.tar"
      - name: Retain unsigned hosted voice image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-v85-voice-image-${{ matrix.replica }}
          path: ${{ runner.temp }}/teleagent-v85-voice-image.docker.tar
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  compare:
    name: compare-independent-hosted-voice-images
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Read both unsigned image replicas
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          pattern: unsigned-v85-voice-image-*
          path: ${{ runner.temp }}/teleagent-v85-voice-images
      - name: Compare every byte of independently built images
        shell: bash
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/teleagent-v85-voice-images/unsigned-v85-voice-image-1/teleagent-v85-voice-image.docker.tar"
          second="$RUNNER_TEMP/teleagent-v85-voice-images/unsigned-v85-voice-image-2/teleagent-v85-voice-image.docker.tar"
          test -s "$first"
          test -s "$second"
          cmp --silent "$first" "$second"
          sha256sum "$first" "$second"
          echo 'Two unsigned hosted voice image replicas match; releaseApproved=false.'
