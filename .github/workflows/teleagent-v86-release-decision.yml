name: Teleagent v86 release decision

on:
  push:
    branches:
      - feat/teleagent-v86-groups-release-20261031
    paths:
      - .github/workflows/teleagent-v86-release-decision.yml
      - releases/v86.json
      - scripts/release_engine.py
      - scripts/release-tool.py
      - scripts/verify-v86-voice-scan.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Compare exact current bundle replicas and fresh scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require hosted authority branch or protected main
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REPOSITORY_ID:-}" = 1383172221
          case "$GITHUB_REF" in
            refs/heads/feat/teleagent-v86-groups-release-20261031|refs/heads/main) ;;
            *) exit 1 ;;
          esac
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 5242880
      - name: Read exact authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check decision and consumer refusal contracts
        run: |
          python3 -I -B scripts/test_verify_v86_voice_scan.py
          python3 -I -B scripts/test_project_v86_security_packages.py
          python3 -I -B scripts/test_release_engine.py
          python3 -I -B scripts/release-tool.py --release v86 check
      - name: Fetch pinned hosted evidence only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/release-tool.py --release v86 fetch --destination "$RUNNER_TEMP/teleagent-v86-release-inputs"
      - name: Recompare complete bytes and recompute current scan decision
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/teleagent-v86-release-inputs"
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-release-evidence"
          python3 -I -B scripts/release-tool.py --release v86 verify \
            --bundle-a "$input/bundle-a/teleagent-release.diagnostic.tar" \
            --bundle-b "$input/bundle-b/teleagent-release.diagnostic.tar" \
            --summary-a "$input/bundle-a/summary.json" \
            --summary-b "$input/bundle-b/summary.json" \
            --voice-image "$input/image/teleagent-v86-voice-image.docker.tar" \
            --scan-report "$input/scan/scan.json" \
            --scan-metadata "$input/scan/db-metadata.json" \
            --scan-check "$input/scan/scan-check.json" \
            --output "$RUNNER_TEMP/teleagent-release-evidence/decision.json"
      - name: Retain bounded evidence decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teleagent-v86-release-evidence
          path: ${{ runner.temp }}/teleagent-release-evidence/decision.json
          if-no-files-found: error
          retention-days: 2

  sign:
    name: Sign only the protected main release decision
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Require GitHub-confirmed protected main ref
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$GITHUB_REF" = refs/heads/main
          test "${GITHUB_REF_PROTECTED:-}" = true
          test "$GITHUB_REPOSITORY_ID" = 1383172221
      - name: Read exact protected authority source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Independently fetch pinned hosted evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/release-tool.py --release v86 fetch --destination "$RUNNER_TEMP/teleagent-v86-release-inputs"
      - name: Revalidate and form one protected decision predicate
        shell: bash
        run: |
          set -euo pipefail
          input="$RUNNER_TEMP/teleagent-v86-release-inputs"
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-accepted-release"
          install -m 0444 "$input/bundle-a/teleagent-release.diagnostic.tar" \
            "$RUNNER_TEMP/teleagent-accepted-release/teleagent-release.tar"
          python3 -I -B scripts/release-tool.py --release v86 verify \
            --bundle-a "$RUNNER_TEMP/teleagent-accepted-release/teleagent-release.tar" \
            --bundle-b "$input/bundle-b/teleagent-release.diagnostic.tar" \
            --summary-a "$input/bundle-a/summary.json" \
            --summary-b "$input/bundle-b/summary.json" \
            --voice-image "$input/image/teleagent-v86-voice-image.docker.tar" \
            --scan-report "$input/scan/scan.json" \
            --scan-metadata "$input/scan/db-metadata.json" \
            --scan-check "$input/scan/scan-check.json" \
            --output "$RUNNER_TEMP/teleagent-accepted-release/decision.json" \
            --authorize
      - name: Attest the exact accepted release subject and decision
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v5.2.0
        with:
          subject-path: ${{ runner.temp }}/teleagent-accepted-release/teleagent-release.tar
          predicate-type: https://github.com/javAlborz/teleagent-release-authority/attestations/release-decision/v1
          predicate-path: ${{ runner.temp }}/teleagent-accepted-release/decision.json
      - name: Retain exact Sigstore bundle beside subject
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE"
          install -m 0444 "$ATTESTATION_BUNDLE" \
            "$RUNNER_TEMP/teleagent-accepted-release/attestation.json"
      - name: Pass the signed subject to an independent consumer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teleagent-v86-release-signed-input
          path: ${{ runner.temp }}/teleagent-accepted-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  consume:
    name: Verify signer and publish exact host approval
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Require fresh hosted protected main consumer
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY_ID" = 1383172221
      - name: Read exact authority consumer source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Receive only the signed release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          name: teleagent-v86-release-signed-input
          path: ${{ runner.temp }}/teleagent-consumed-release
      - name: Verify exact custom attestation and signer identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/teleagent-consumed-release"
          test "$(find "$release" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 3
          printf '%s  %s\n' \
            '49d3460a9509de4367262418883a40209b247ab2c4dcefaee3da0e4c31e678be' \
            "$release/teleagent-release.tar" | sha256sum --check --status
          gh attestation verify "$release/teleagent-release.tar" \
            --bundle "$release/attestation.json" \
            --repo javAlborz/teleagent-release-authority \
            --signer-workflow javAlborz/teleagent-release-authority/.github/workflows/teleagent-v86-release-decision.yml \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type https://github.com/javAlborz/teleagent-release-authority/attestations/release-decision/v1 \
            --format json > "$RUNNER_TEMP/teleagent-verified-attestation.json"
          python3 -I -B scripts/release-tool.py --release v86 consume \
            --verified "$RUNNER_TEMP/teleagent-verified-attestation.json" \
            --decision "$release/decision.json" \
            --bundle "$release/teleagent-release.tar" \
            --approval "$release/release-approval.json"
      - name: Retain the verified release and exact approval
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teleagent-v86-accepted-release
          path: ${{ runner.temp }}/teleagent-consumed-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Export bounded host-review metadata from the verified bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/teleagent-consumed-release" "$RUNNER_TEMP/teleagent-v86-host-metadata" <<'PYCODE'
          import hashlib, json, shutil, sys, tarfile
          from pathlib import Path
          source, target = map(Path, sys.argv[1:])
          policy = json.loads(Path('releases/v86.json').read_bytes())
          target.mkdir(mode=0o700)
          name = 'sha256-' + policy['manifestSha256'] + '/teleagent-release.manifest.json'
          with tarfile.open(source / 'teleagent-release.tar', 'r:') as archive:
              members = archive.getmembers()
              assert 0 < len(members) <= 100000
              member = archive.getmember(name)
              assert member.isfile() and 0 < member.size <= 262144
              body = archive.extractfile(member).read()
              assert hashlib.sha256(body).hexdigest() == policy['manifestSha256']
              (target / 'teleagent-release.manifest.json').write_bytes(body)
              (target / 'host-metadata.json').write_text(json.dumps({
                  'bundleSha256': policy['bundleSha256'], 'bundleBytes': policy['bundleBytes'],
                  'memberCount': len(members), 'logicalFileBytes': sum(m.size for m in members if m.isfile()),
                  'purpose': 'host-review-only; exact signed bundle still required for staging'}, sort_keys=True)+'\n')
          for name in ('release-approval.json', 'decision.json', 'attestation.json'):
              assert (source/name).is_file() and (source/name).stat().st_size <= 1048576
              shutil.copyfile(source/name, target/name)
          PYCODE
      - name: Retain small host-review metadata separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teleagent-v86-host-metadata
          path: ${{ runner.temp }}/teleagent-v86-host-metadata/
          if-no-files-found: error
          retention-days: 30
