name: Teleagent unsigned voice image attestation diagnostic only

on:
  push:
    branches:
      - feat/hosted-capacity-probe-20260923
    paths:
      - .github/workflows/teleagent-voice-image-attestation-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: bind-matched-unsigned-image-no-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require exact hosted authority and completed diagnostic evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/hosted-capacity-probe-20260923
          for row in \
            '35933786693 3ca573d1c62e473851913e3107e3aacdc9de5232' \
            '35933788586 3ca573d1c62e473851913e3107e3aacdc9de5232' \
            '35933905774 d21efeadd5a23be4127133bcee9a666a391cf756' \
            '35934797140 eb059882c1b4622ddee7f61ae1a7ef685493cf13'; do
            read -r run_id head <<< "$row"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              --jq '[.status,.conclusion,.head_sha,.head_branch] | @tsv' \
              | { read -r status conclusion observed branch
                  test "$status" = completed
                  test "$conclusion" = success
                  test "$observed" = "$head"
                  test "$branch" = feat/hosted-capacity-probe-20260923
                }
          done
      - name: Retrieve one exact unsigned image as data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-unsigned-voice-image"
          gh run download 35933786693 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-voice-image-diagnostic \
            --dir "$RUNNER_TEMP/teleagent-unsigned-voice-image"
          test "$(find "$RUNNER_TEMP/teleagent-unsigned-voice-image" -mindepth 1 -maxdepth 1 -type f | wc -l)" = 1
          printf '%s  %s\n' \
            3d8aa6bf1509f45cbe2dc78a2679b3a16b14fe4043749920c9a864c0b6026e01 \
            "$RUNNER_TEMP/teleagent-unsigned-voice-image/teleagent-voice-image-diagnostic.docker.tar" \
            | sha256sum --check --status
      - name: Pass only exact unsigned archive bytes to a separate signer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teleagent-unsigned-voice-image-for-attestation-diagnostic
          path: ${{ runner.temp }}/teleagent-unsigned-voice-image/teleagent-voice-image-diagnostic.docker.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: attest-unsigned-image-on-separate-hosted-signer-no-release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Require exact separate hosted signer
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/hosted-capacity-probe-20260923
      - name: Read only the matched unsigned image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teleagent-unsigned-voice-image-for-attestation-diagnostic
          path: ${{ runner.temp }}/teleagent-unsigned-voice-image
      - name: Bind image bytes before attesting
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            3d8aa6bf1509f45cbe2dc78a2679b3a16b14fe4043749920c9a864c0b6026e01 \
            "$RUNNER_TEMP/teleagent-unsigned-voice-image/teleagent-voice-image-diagnostic.docker.tar" \
            | sha256sum --check --status
      - name: Attest only the diagnostic archive
        id: attest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/teleagent-unsigned-voice-image/teleagent-voice-image-diagnostic.docker.tar
      - name: Retain only the diagnostic Sigstore bundle
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-unsigned-image-bundle"
          test -f "$ATTESTATION_BUNDLE"
          cp -- "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/teleagent-unsigned-image-bundle/bundle.json"
          test -s "$RUNNER_TEMP/teleagent-unsigned-image-bundle/bundle.json"
      - name: Pass only the bundle to a consuming verifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teleagent-unsigned-voice-image-attestation-diagnostic-bundle
          path: ${{ runner.temp }}/teleagent-unsigned-image-bundle/bundle.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: verify-unsigned-image-attestation-on-separate-host-no-release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Require exact separate hosted verifier
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/hosted-capacity-probe-20260923
      - name: Read the unsigned diagnostic archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teleagent-unsigned-voice-image-for-attestation-diagnostic
          path: ${{ runner.temp }}/teleagent-unsigned-voice-image
      - name: Read the diagnostic attestation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: teleagent-unsigned-voice-image-attestation-diagnostic-bundle
          path: ${{ runner.temp }}/teleagent-unsigned-image-bundle
      - name: Verify exact image digest and certified signer identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/teleagent-unsigned-voice-image/teleagent-voice-image-diagnostic.docker.tar"
          printf '%s  %s\n' \
            3d8aa6bf1509f45cbe2dc78a2679b3a16b14fe4043749920c9a864c0b6026e01 \
            "$archive" | sha256sum --check --status
          gh attestation verify "$archive" \
            --bundle "$RUNNER_TEMP/teleagent-unsigned-image-bundle/bundle.json" \
            --repo javAlborz/teleagent-release-authority \
            --signer-workflow javAlborz/teleagent-release-authority/.github/workflows/teleagent-voice-image-attestation-diagnostic.yml \
            --signer-digest "$GITHUB_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/feat/hosted-capacity-probe-20260923 \
            --deny-self-hosted-runners \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > "$RUNNER_TEMP/teleagent-unsigned-image-verified.json"
          python3 -I - "$RUNNER_TEMP/teleagent-unsigned-image-verified.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          assert 0 < path.stat().st_size <= 1024 * 1024
          records = json.loads(path.read_bytes())
          assert type(records) is list and len(records) == 1
          result = records[0]['verificationResult']
          statement = result['statement']
          assert statement['predicateType'] == 'https://slsa.dev/provenance/v1'
          assert type(statement['subject']) is list and len(statement['subject']) == 1
          assert statement['subject'][0]['digest'] == {
              'sha256': '3d8aa6bf1509f45cbe2dc78a2679b3a16b14fe4043749920c9a864c0b6026e01'}
          assert type(result['signature']['certificate']) is dict
          print({'schema': 'teleagent.unsigned-image-attestation-diagnostic.v1',
                 'diagnosticImageVerified': True, 'scanApproved': False,
                 'releaseApproved': False, 'installed': False})
          PY
