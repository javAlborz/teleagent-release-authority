name: Teleagent unsigned voice image vulnerability scan diagnostic only

on:
  push:
    branches:
      - feat/hosted-capacity-probe-20260923
    paths:
      - .github/workflows/teleagent-voice-image-scan-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  scan:
    name: scan-fixed-unsigned-image-on-disposable-hosted-runner-no-release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require exact hosted context and successful independent comparison
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${GITHUB_REPOSITORY:-}" = javAlborz/teleagent-release-authority
          test "${GITHUB_REF:-}" = refs/heads/feat/hosted-capacity-probe-20260923
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/35933905774" \
            --jq '[.status,.conclusion,.head_sha,.head_branch] | @tsv' \
            | { read -r status conclusion head_sha branch
                test "$status" = completed
                test "$conclusion" = success
                test "$head_sha" = d21efeadd5a23be4127133bcee9a666a391cf756
                test "$branch" = feat/hosted-capacity-probe-20260923
              }
      - name: Retrieve fixed unsigned image archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/voice-image"
          gh run download 35933786693 --repo "$GITHUB_REPOSITORY" \
            --name unsigned-voice-image-diagnostic --dir "$RUNNER_TEMP/voice-image"
          image="$RUNNER_TEMP/voice-image/teleagent-voice-image-diagnostic.docker.tar"
          test -f "$image"
          printf '%s  %s\n' \
            3d8aa6bf1509f45cbe2dc78a2679b3a16b14fe4043749920c9a864c0b6026e01 \
            "$image" | sha256sum --check --status
      - name: Verify exact Trivy archive and contained executable bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 0700 "$RUNNER_TEMP/teleagent-trivy"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 180 --output "$RUNNER_TEMP/teleagent-trivy/trivy.tar.gz" \
            https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
          test "$(stat -c %s "$RUNNER_TEMP/teleagent-trivy/trivy.tar.gz")" = 50352156
          printf '%s  %s\n' \
            bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea \
            "$RUNNER_TEMP/teleagent-trivy/trivy.tar.gz" | sha256sum --check --status
          tar -xOzf "$RUNNER_TEMP/teleagent-trivy/trivy.tar.gz" trivy > "$RUNNER_TEMP/teleagent-trivy/trivy"
          printf '%s  %s\n' \
            0e69edd134a3c338baa1a6806920773615d682b18cbc6a0cba2a3b658ef9b63e \
            "$RUNNER_TEMP/teleagent-trivy/trivy" | sha256sum --check --status
          chmod 0500 "$RUNNER_TEMP/teleagent-trivy/trivy"
          "$RUNNER_TEMP/teleagent-trivy/trivy" --version
      - name: Download current vulnerability database and scan unsigned image
        shell: bash
        run: |
          set -euo pipefail
          trivy="$RUNNER_TEMP/teleagent-trivy/trivy"
          cache="$RUNNER_TEMP/teleagent-trivy/cache"
          mkdir -m 0700 "$cache"
          "$trivy" image --download-db-only --cache-dir "$cache" \
            --disable-telemetry --no-progress
          python3 -I - "$cache/db/metadata.json" <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          import sys
          from pathlib import Path
          metadata = json.loads(Path(sys.argv[1]).read_bytes())
          next_update = datetime.fromisoformat(metadata['NextUpdate'].replace('Z', '+00:00'))
          assert next_update.tzinfo is not None
          assert next_update > datetime.now(timezone.utc) + timedelta(hours=1)
          print('Current Trivy DB NextUpdate:', next_update.isoformat())
          PY
          "$trivy" image \
            --input "$RUNNER_TEMP/voice-image/teleagent-voice-image-diagnostic.docker.tar" \
            --scanners vuln --offline-scan --skip-db-update --skip-java-db-update \
            --skip-check-update --disable-telemetry --no-progress \
            --cache-dir "$cache" --format json --exit-code 0 \
            --output "$RUNNER_TEMP/teleagent-trivy/scan.json"
          python3 -I - "$RUNNER_TEMP/teleagent-trivy/scan.json" <<'PY'
          from collections import Counter
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_bytes())
          assert report['SchemaVersion'] == 2
          findings = Counter()
          targets = []
          for row in report.get('Results', []):
              targets.append(row['Target'])
              for issue in row.get('Vulnerabilities') or []:
                  findings[issue['Severity']] += 1
          assert targets, 'scanner reported no targets'
          print('Diagnostic scan targets:', len(targets))
          print('Diagnostic vulnerability counts:', dict(sorted(findings.items())))
          print('scanExecuted=true scanApproved=false signatureVerified=false releaseApproved=false installed=false')
          PY
      - name: Retain one-day diagnostic scan report for triage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-voice-image-scan-diagnostic
          path: ${{ runner.temp }}/teleagent-trivy/scan.json
          if-no-files-found: error
          retention-days: 1
